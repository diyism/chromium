sudo: required
dist: trusty

language: cpp
compiler:
    - gcc

branches:
    only:
        - master

before_install:
    - sudo add-apt-repository -y ppa:saiarcot895/chromium-beta
    - sudo apt-get --yes update
    - sudo apt-get --yes install ninja-build
    - sudo ./build/install-build-deps.sh
    - gclient runhooks

script: ninja -C out/Release chrome
